<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>김택권 포트폴리오</title>
  <meta name="description" content="김택권의 프론트엔드와 Unity 포트폴리오를 웹과 슬라이드로 확인하세요.">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px; color: #0b1f3d; background: linear-gradient(135deg, #eef3f8, #fff8ec); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif; }
    main { width: min(1040px, 100%); }
    .eyebrow { color: #1f64e0; font-weight: 800; font-size: 13px; letter-spacing: .12em; }
    h1 { font-size: clamp(36px, 6vw, 64px); margin: 12px 0; word-break: keep-all; }
    .intro { color: #526173; line-height: 1.65; margin-bottom: 32px; }
    .versions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
    .version { display:block; border:1px solid #ccd7e4; border-top:5px solid #1f64e0; border-radius:20px; padding:28px 32px; background:#fff; color:inherit; text-decoration:none; }
    .version.unity { border-top-color:#078575; }
    .version h2 { font-size: 28px; margin: 0 0 16px; word-break: keep-all; }
    .version p { margin:0; color:#526173; line-height:1.7; word-break:keep-all; }
    .version:hover { border-color:#1f64e0; background:#f8fbff; }
    .version.unity:hover { border-color:#078575; background:#f5fbf8; }
    .version:focus-visible { outline:3px solid #1f64e0; outline-offset:4px; }
    @media (max-width: 700px) { body { padding: 24px 16px; } .versions { grid-template-columns: 1fr; } .version { padding: 24px; } .version p { min-height: 0; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">KIM TAEK KWON PORTFOLIO</p>
    <h1>김택권 포트폴리오</h1>
    <p class="intro">지원 분야와 보기 방식에 맞춰 포트폴리오를 선택하세요.</p>
    <nav class="versions" aria-label="포트폴리오 바로가기">
      <a class="version" href="./web-starter/" aria-labelledby="front-web-title">
        <h2 id="front-web-title">프론트엔드 웹</h2>
        <p>Flutter 앱의 제작과 출시, 게임, FastAPI와 AI/RAG 프로젝트를 소개합니다.</p>
      </a>
      <a class="version" href="./portfolio-ppt/" aria-labelledby="front-slides-title">
        <h2 id="front-slides-title">프론트엔드 슬라이드</h2>
        <p>앱과 게임, AI 활용 개발 사례를 23장의 슬라이드로 정리했습니다.</p>
      </a>
      <a class="version unity" href="./Unity_Portfolio/web-starter/" aria-labelledby="unity-web-title">
        <h2 id="unity-web-title">Unity 웹</h2>
        <p>회사 Unity 콘텐츠와 우주좀비, 하드웨어 연동 경험을 먼저 소개합니다.</p>
      </a>
      <a class="version unity" href="./Unity_Portfolio/portfolio-ppt/" aria-labelledby="unity-slides-title">
        <h2 id="unity-slides-title">Unity 슬라이드</h2>
        <p>회사 Unity 콘텐츠와 우주좀비, 하드웨어 연동 경험을 23장의 슬라이드로 정리했습니다.</p>
      </a>
    </nav>
  </main>
</body>
</html>
